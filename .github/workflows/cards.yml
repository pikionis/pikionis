name: Refresh README

on:
  schedule:
    - cron: "17 4 * * *" # every morning, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "data/logo.json", "data/profile.json"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the contribution calendar
        run: python scripts/fetch_contributions.py pikionis
      - name: Fetch my repositories and the projects on onehublabs.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_work.py pikionis
      - name: Render README cards (hero, tiles, graph, activity, repos)
        run: python scripts/render_readme_cards.py
      - name: Commit the cards if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards data README.md
          git diff --cached --quiet || git commit -m "Refresh README"
          git push
